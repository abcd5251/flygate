<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8592A6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E5484D"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C26A00"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="#F5F7FA"/>

  <!-- Title -->
  <text x="40" y="62" font-size="34" font-weight="800" fill="#0F294D">FlyGate pipeline</text>
  <text x="40" y="98" font-size="19" fill="#455873">AI ranks. The gate decides. Money moves only when the ticket is issued.</text>

  <!-- Arrows between stages -->
  <g stroke="#8592A6" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="264" y1="250" x2="296" y2="250"/>
    <line x1="524" y1="250" x2="556" y2="250"/>
    <line x1="784" y1="250" x2="816" y2="250"/>
    <line x1="1044" y1="250" x2="1076" y2="250"/>
    <line x1="1304" y1="250" x2="1336" y2="250"/>
  </g>

  <!-- Stage cards: 6 × 220 wide, step 260 -->
  <g>
    <!-- 1 You -->
    <rect x="40" y="150" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#E4E8EF" stroke-width="1.5"/>
    <rect x="40" y="150" width="220" height="8" rx="4" fill="#3264FF"/>
    <circle cx="74" cy="192" r="16" fill="#3264FF"/>
    <text x="74" y="198" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="100" y="198" font-size="14" font-weight="700" fill="#3264FF">YOU</text>
    <text x="60" y="242" font-size="21" font-weight="800" fill="#0F294D">Sign once</text>
    <text x="60" y="272" font-size="15" fill="#455873">Trip + price cap</text>
    <text x="60" y="294" font-size="15" fill="#455873">become on-chain rules</text>
    <text x="60" y="330" font-size="13" font-weight="600" fill="#6D4AFF">ML-DSA-87 · ML-KEM-1024</text>

    <!-- 2 Agent -->
    <rect x="300" y="150" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#E4E8EF" stroke-width="1.5"/>
    <rect x="300" y="150" width="220" height="8" rx="4" fill="#2B59C3"/>
    <circle cx="334" cy="192" r="16" fill="#2B59C3"/>
    <text x="334" y="198" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="360" y="198" font-size="14" font-weight="700" fill="#2B59C3">AGENT</text>
    <text x="320" y="242" font-size="21" font-weight="800" fill="#0F294D">Search &amp; rank</text>
    <text x="320" y="272" font-size="15" fill="#455873">Fetch Duffel fares,</text>
    <text x="320" y="294" font-size="15" fill="#455873">AI ranks the options</text>
    <text x="320" y="330" font-size="13" font-weight="600" fill="#2B59C3">8 offers</text>

    <!-- 3 Gate -->
    <rect x="560" y="150" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#00A86B" stroke-width="2.5"/>
    <rect x="560" y="150" width="220" height="8" rx="4" fill="#00A86B"/>
    <circle cx="594" cy="192" r="16" fill="#00A86B"/>
    <text x="594" y="198" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="620" y="198" font-size="14" font-weight="700" fill="#00A86B">GATE</text>
    <text x="580" y="242" font-size="21" font-weight="800" fill="#0F294D">Check rules</text>
    <text x="580" y="272" font-size="15" fill="#455873">Fare, refund, cabin,</text>
    <text x="580" y="294" font-size="15" fill="#455873">date, route</text>
    <text x="580" y="330" font-size="13" font-weight="600" fill="#00A86B">4 pass · 4 blocked</text>

    <!-- 4 Escrow -->
    <rect x="820" y="150" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#E4E8EF" stroke-width="1.5"/>
    <rect x="820" y="150" width="220" height="8" rx="4" fill="#6D4AFF"/>
    <circle cx="854" cy="192" r="16" fill="#6D4AFF"/>
    <text x="854" y="198" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="880" y="198" font-size="14" font-weight="700" fill="#6D4AFF">CHAIN</text>
    <text x="840" y="242" font-size="21" font-weight="800" fill="#0F294D">Lock in escrow</text>
    <text x="840" y="272" font-size="15" fill="#455873">Verify signed quote,</text>
    <text x="840" y="294" font-size="15" fill="#455873">agent pays escrow</text>
    <text x="840" y="330" font-size="13" font-weight="600" fill="#6D4AFF">pqcVerify · FlightEscrow</text>

    <!-- 5 Ticket -->
    <rect x="1080" y="150" width="220" height="200" rx="18" fill="#FFFFFF" stroke="#E4E8EF" stroke-width="1.5"/>
    <rect x="1080" y="150" width="220" height="8" rx="4" fill="#0B7A75"/>
    <circle cx="1114" cy="192" r="16" fill="#0B7A75"/>
    <text x="1114" y="198" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="1140" y="198" font-size="14" font-weight="700" fill="#0B7A75">MERCHANT</text>
    <text x="1100" y="242" font-size="21" font-weight="800" fill="#0F294D">Book &amp; ticket</text>
    <text x="1100" y="272" font-size="15" fill="#455873">Decrypt passport,</text>
    <text x="1100" y="294" font-size="15" fill="#455873">create Duffel order</text>
    <text x="1100" y="330" font-size="13" font-weight="600" fill="#0B7A75">Booking ref issued</text>

    <!-- 6 Payout -->
    <rect x="1340" y="150" width="220" height="200" rx="18" fill="#3264FF"/>
    <circle cx="1374" cy="192" r="16" fill="#FFFFFF"/>
    <text x="1374" y="198" font-size="16" font-weight="800" fill="#3264FF" text-anchor="middle">6</text>
    <text x="1400" y="198" font-size="14" font-weight="700" fill="#FFFFFF">CHAIN</text>
    <text x="1360" y="242" font-size="21" font-weight="800" fill="#FFFFFF">Pay on ticket</text>
    <text x="1360" y="272" font-size="15" fill="#DCE6FF">Signed ticket proof</text>
    <text x="1360" y="294" font-size="15" fill="#DCE6FF">verified, then released</text>
    <text x="1360" y="330" font-size="13" font-weight="600" fill="#FFFFFF">You're ticketed</text>
  </g>

  <!-- Failure branches -->
  <path d="M670 350 V 420" stroke="#E5484D" stroke-width="2.5" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
  <rect x="560" y="424" width="220" height="74" rx="14" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
  <text x="580" y="455" font-size="16" font-weight="800" fill="#E5484D">Blocked</text>
  <text x="580" y="480" font-size="14" fill="#0F294D">Over the cap, nothing paid</text>

  <path d="M1190 350 V 420" stroke="#C26A00" stroke-width="2.5" fill="none" stroke-dasharray="6 6" marker-end="url(#arrow-amber)"/>
  <rect x="1080" y="424" width="220" height="74" rx="14" fill="#FFF4E0" stroke="#C26A00" stroke-width="1.5"/>
  <text x="1100" y="455" font-size="16" font-weight="800" fill="#C26A00">Booking fails</text>
  <text x="1100" y="480" font-size="14" fill="#0F294D">Escrow auto-refunds you</text>

  <!-- On-chain guard band -->
  <rect x="40" y="560" width="1520" height="120" rx="18" fill="#0B1220"/>
  <text x="72" y="600" font-size="15" font-weight="700" fill="#F3B43F" letter-spacing="1.5">ALWAYS ENFORCED ON-CHAIN, EVEN IF THE AGENT KEY LEAKS</text>
  <g font-size="16" fill="#D9E1EC">
    <text x="72" y="644">Spending cap</text>
    <text x="262" y="644" fill="#22304A">|</text>
    <text x="292" y="644">Escrow-only payments</text>
    <text x="512" y="644" fill="#22304A">|</text>
    <text x="542" y="644">Key expiry</text>
    <text x="682" y="644" fill="#22304A">|</text>
    <text x="712" y="644">One transaction</text>
    <text x="892" y="644" fill="#22304A">|</text>
    <text x="922" y="644">Replay protection</text>
    <text x="1112" y="644" fill="#22304A">|</text>
    <text x="1142" y="644" fill="#B6A0FF">Rule changes &amp; revoke need your ML-DSA-87 key</text>
  </g>
</svg>
